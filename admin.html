<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản trị sản phẩm - Bài 1</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="admin-page">
  <div class="admin-wrap">
    <header class="admin-header">
      <div class="cap">🎓</div>
      <h1>QUẢN LÝ SẢN PHẨM</h1>
      <p>HTML & CSS · JavaScript · Python · AI/ML</p>
    </header>

    <form class="product-form" id="productForm">
      <div class="form-grid">
        <div class="field">
          <label for="code">Mã hàng <span>*</span></label>
          <input id="code" name="code" type="text" placeholder="SP001" required>
        </div>
        <div class="field">
          <label for="name">Tên hàng <span>*</span></label>
          <input id="name" name="name" type="text" placeholder="Áo hoodie basic" required>
        </div>

        <div class="field">
          <label for="brand">Hãng sản xuất <span>*</span></label>
          <input id="brand" name="brand" type="text" placeholder="Local Brand" required>
        </div>
        <div class="field">
          <label for="origin">Xuất xứ</label>
          <select id="origin" name="origin">
            <option>Việt Nam</option>
            <option>Hàn Quốc</option>
            <option>Trung Quốc</option>
            <option>Thái Lan</option>
            <option>Nhật Bản</option>
          </select>
        </div>

        <div class="field full">
          <label for="description">Mô tả sản phẩm</label>
          <textarea id="description" name="description" placeholder="Nhập mô tả sản phẩm, chất liệu, màu sắc, kích thước..."></textarea>
        </div>

        <div class="field full">
          <label for="price">Giá sản phẩm</label>
          <input id="price" name="price" type="number" min="0" placeholder="250000">
        </div>
      </div>

      <div class="price-note">💰 Giá tham khảo: <strong>250.000đ — 800.000đ</strong> tùy sản phẩm</div>

      <div class="form-actions">
        <button class="btn primary" type="submit">Lưu sản phẩm</button>
        <button class="btn reset" type="reset">Làm lại</button>
        <a class="btn shop-link" href="index.html">Xem cửa hàng</a>
      </div>
      <p id="formMessage" class="form-message"></p>
    </form>
  </div>
  <script src="app.js"></script>
</body>
</html>
